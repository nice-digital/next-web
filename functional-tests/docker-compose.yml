services:
  # Selenium 4.8.0, the same images cks-gatsby and bnf-gatsby run. 3.141.59 was
  # the final Selenium 3 release and this image was built 2021-07-13, so the grid
  # was four and a half years behind a wdio 8 client that speaks W3C first.
  #
  # bnf-gatsby sat on a 2022 grid and suffered roaming 60s command stalls: a
  # request would go out and its response never come back, while the browser sat
  # idle and healthy. Bumping to these images cleared it - five consecutive green
  # builds across three agents. See section 10 of the CodeArtifact playbook.
  #
  # Tagged by Selenium version rather than Chrome version so hub and node are
  # visibly the same release, and dated so the tag is immutable: plain `4.8.0` is
  # re-pushed whenever Selenium rebuilds the image.
  selenium-hub:
    image: selenium/hub:4.8.0-20230210
    container_name: nxt-selenium-hub
    ports:
      - '4444:4444'

  selenium-chrome:
    # Chrome 91 -> 110. Selenium 4 replaced the Selenium 3 HUB_HOST/HUB_PORT
    # registration with an event bus, so those two vars had to change with the
    # image. The bus is reached over the compose network, so unlike 4444 it needs
    # no host port published.
    image: selenium/node-chrome:4.8.0-20230210
    container_name: nxt-selenium-chrome
    # 2gb to match the sibling repos. Chrome renders into /dev/shm and the chrome
    # args here do not set --disable-dev-shm-usage, so 1gb risks renderer crashes
    # on heavy pages now that the browser is 19 releases newer.
    shm_size: '2gb'
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443

  nxt-test-runner:
    build:
      context: .
      args:
        - NPM_TOKEN
    container_name: nxt-test-runner
    depends_on:
      - selenium-hub
      - next-web
    environment:
      - TEAMCITY_VERSION
    volumes:
      - ./:/next-web/tests
      - /next-web/tests/node_modules/
      - ./errorShots:/next-web/tests/errorShots

  # New Next Web (NextJS web app)
  next-web:
    image: nextweb:latest
    ## Uncomment the two lines below to run with a specific image with a specific Teamcity build number
    # image: xxxxxxxxxxxx.dkr.ecr.eu-west-1.amazonaws.com/nextweb:nnnn
    # command: ["npm", "run", "host-console-logging"]
    container_name: next-web
    build:
      context: ./../web/
      args:
        - NPM_TOKEN
    depends_on:
      - mock-search-api
      - mock-publications
      - mock-indev
    ports:
      # Next Web runs on 8092 in PM2: see pm2.ecosystem.json in the web-host folder
      - '3000:3000'
    volumes:
      - ./../web:/web
    environment:
      - SEARCH_BASE_URL
      - PUBLICATIONS_BASE_URL
      - INDEV_BASE_URL
      - STORYBLOK_TOKEN
      - STORYBLOK_ROUTE_CATCHALL
      - JOTFORM_BASE_URL
      - JOTFORM_APIKEY
    networks:
      default:
        aliases:
          # Make sure the app uses a nice.org.uk domain so that the cookie banner license works
          - next-web-tests.nice.org.uk

  mock-search-api:
    build: https://github.com/nice-digital/mocks-apis.git#main:search-apis
    container_name: mock-search-api
    command: npm start
    networks:
      default:
        aliases:
          - mock-search-api.nice.org.uk

  mock-publications:
    build: https://github.com/nice-digital/mocks-apis.git#main:publications
    container_name: mock-publications
    command: npm start
    networks:
      default:
        aliases:
          - mock-publications.nice.org.uk

  mock-indev:
    build: https://github.com/nice-digital/mocks-apis.git#main:indev
    container_name: mock-indev
    command: npm start
    networks:
      default:
        aliases:
          - mock-indev.nice.org.uk
networks:
  default:
    name: next-web-functional-tests
